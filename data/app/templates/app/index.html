<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phantom DX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12141a;
    --panel: #1a1d24;
    --panel-raised: #20232b;
    --border: #2a2e38;
    --text: #e9e7e2;
    --text-dim: #8a8f9c;
    --text-faint: #565b68;
    --accent: #7dd3bf;
    --accent-dim: #4f8f82;
    --user: #d9a5f0;
    --danger: #e08a7d;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(125,211,191,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(217,165,240,0.04), transparent 40%);
    font-family: var(--sans);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .terminal {
    width: 100%;
    max-width: 640px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    height: min(720px, 88vh);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--panel-raised);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .dots { display: flex; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border); }

  .titlebar-label {
    margin-left: 4px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent-dim);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  #chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  #chat-box::-webkit-scrollbar { width: 8px; }
  #chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  #chat-box::-webkit-scrollbar-track { background: transparent; }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-faint);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.7;
  }
  .empty-state .arrow { color: var(--accent-dim); }

  .row {
    display: flex;
    padding: 10px 0;
    max-width: 92%;
    animation: rise 0.28s ease;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .row.user {
    align-self: flex-end;
    flex-direction: column;
    align-items: flex-end;
  }

  .row.ai {
    align-self: flex-start;
    flex-direction: row;
    align-items: flex-start;
    gap: 10px;
  }

  .avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    margin-top: 2px;
    transition: box-shadow 0.3s ease, border-color 0.3s ease;
  }

  .avatar.pulsing {
    border-color: var(--accent-dim);
    animation: avatarGlow 1.4s ease-in-out infinite;
  }

  @keyframes avatarGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(125,211,191,0.35); }
    50% { box-shadow: 0 0 0 5px rgba(125,211,191,0); }
  }

  .ai-content {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
  }

  .tag {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row.user .tag { color: var(--user); }
  .row.ai .tag { color: var(--accent); }

  .tag::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
  }

  .bubble {
    font-size: 14.5px;
    line-height: 1.55;
    padding: 10px 14px;
    border-radius: 8px;
    white-space: pre-wrap;
    word-wrap: break-word;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .row.user .bubble {
    background: rgba(217,165,240,0.09);
    border: 1px solid rgba(217,165,240,0.22);
    border-top-right-radius: 2px;
    color: var(--text);
  }
  .row.user .bubble:hover {
    border-color: rgba(217,165,240,0.4);
  }

  .row.ai .bubble {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-top-left-radius: 2px;
    color: var(--text);
  }
  .row.ai .bubble:hover {
    border-color: var(--accent-dim);
  }

  .timestamp {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    margin-top: 4px;
    padding: 0 2px;
  }

  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.9s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .thinking-dots { display: inline-flex; gap: 4px; padding: 3px 0; }
  .thinking-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--text-faint);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .thinking-dots span:nth-child(2) { animation-delay: 0.15s; }
  .thinking-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  .input-area {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: var(--panel-raised);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .prompt-sym {
    font-family: var(--mono);
    color: var(--accent);
    font-size: 15px;
    flex-shrink: 0;
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--sans);
    font-size: 14.5px;
    padding: 8px 0;
  }
  #user-input::placeholder { color: var(--text-faint); }

  button#send-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.03em;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
    flex-shrink: 0;
  }
  button#send-btn:hover { border-color: var(--accent-dim); background: rgba(125,211,191,0.06); }
  button#send-btn:active { transform: translateY(1px) scale(0.97); }
  button#send-btn:disabled { opacity: 0.4; cursor: default; }

  @media (max-width: 480px) {
    body { padding: 0; }
    .terminal { max-width: 100%; height: 100vh; border-radius: 0; border: none; }
    .row { max-width: 96%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  #user-input:focus-visible, button#send-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

  <div class="terminal">
    <div class="titlebar">
      <div class="dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <span class="titlebar-label">Phantom DX</span>
      <div class="status"><span class="status-dot"></span>Running</div>
    </div>

    <div id="chat-box">
      <div class="empty-state" id="empty-state">
        No messages yet<br>
        type below and press enter <span class="arrow">→</span>
      </div>
    </div>

    <div class="input-area">
      <span class="prompt-sym">&gt;</span>
      <input type="text" id="user-input" placeholder="Ask your local model something..." autocomplete="off">
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

<script>
  const chatBox = document.getElementById('chat-box');
  const userInput = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');
  const emptyState = document.getElementById('empty-state');

  const BOT_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
    <path d="M2 12h2"></path>
    <path d="M20 12h2"></path>
    <path d="M12 8V4"></path>
    <circle cx="12" cy="3" r="1"></circle>
    <rect x="4" y="8" width="16" height="12" rx="2"></rect>
    <circle cx="9" cy="14" r="1.1" fill="currentColor" stroke="none"></circle>
    <circle cx="15" cy="14" r="1.1" fill="currentColor" stroke="none"></circle>
    <path d="M9 18h6"></path>
  </svg>`;

  userInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  function scrollToBottom() {
    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function addUserMessage(text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `
      <div class="tag">you</div>
      <div class="bubble"></div>
      <div class="timestamp">${timeNow()}</div>
    `;
    row.querySelector('.bubble').textContent = text;
    chatBox.appendChild(row);
    scrollToBottom();
  }

  function addThinkingRow() {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row ai';
    row.innerHTML = `
      <div class="avatar pulsing">${BOT_ICON}</div>
      <div class="ai-content">
        <div class="tag">DX</div>
        <div class="bubble"><div class="thinking-dots"><span></span><span></span><span></span></div></div>
      </div>
    `;
    chatBox.appendChild(row);
    scrollToBottom();
    return row;
  }

  function typeOutResponse(row, fullText) {
    const bubble = row.querySelector('.bubble');
    const avatar = row.querySelector('.avatar');
    bubble.innerHTML = '';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    let i = 0;
    const speed = 14; // ms per character

    function step() {
      if (i < fullText.length) {
        bubble.textContent = fullText.slice(0, i + 1);
        bubble.appendChild(cursor);
        i++;
        scrollToBottom();
        setTimeout(step, speed);
      } else {
        cursor.remove();
        avatar.classList.remove('pulsing');
        const ts = document.createElement('div');
        ts.className = 'timestamp';
        ts.textContent = timeNow();
        row.querySelector('.ai-content').appendChild(ts);
      }
    }
    step();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addUserMessage(text);
    userInput.value = '';
    sendBtn.disabled = true;

    const thinkingRow = addThinkingRow();

    try {
      const response = await fetch('/api/ask/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      const data = await response.json();
      typeOutResponse(thinkingRow, data.reply);
    } catch (error) {
      typeOutResponse(thinkingRow, 'Error: could not reach the local server.');
      thinkingRow.querySelector('.bubble').style.color = 'var(--danger)';
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }
</script>
</body>
</html>
